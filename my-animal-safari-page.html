<html>
    <head>
        <title>My Animal Safari </title>
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
        <style>
            body{
                position: relative;
            }
            .safari-slide{
                height: 200px;
                text-align: center;
                padding-top: 75px;
                font-size: 1.8rem;
                color: white;
            }
            .slide-forest{
                background-color: darkgreen;
            }
            .slide-ocean{
                background: steelblue;
            }
            .slide-desert{
                background-color: orange;
            }
            .section{
                padding: 70px 20px;
                min-height: 300px;
            }
            #forest{
                background-color: honeydew;
            }
            #ocean{
                background-color: aliceblue;
            }
            #desert{
                background-color: lightyellow;
            }
        </style>
    </head>
    <body data-spy="scroll" data-target="#safariNav" data-offset="60">
        <div id="safariCarousel" class="carouselslide" data-ride="carousel" >
            <ol class="carousel-indicators">
                <li data-targget="safariCarousel" data-slide-to="0" class="active"></li>
                <li data-targget="safariCarousel" data-slide-to="1"></li>
                <li data-targget="safariCarousel" data-slide-to="2"></li>
            </ol>
            <div class="carousel-inner">
                <div class="carousel-item active safari-slide slide-forest" >🌿Forest Safari</div>
                <div class="carousel-item safari-slide slide-ocean" >🌊Ocean Safari</div>
                <div class="carousel-item safari-slide slide-desert" >🏜️Desert Safari</div>
            </div>
            <a  class="carousel-control-prev" href="#safariCarousel" data-slide="prev"></a>
            <span class="carousel-control-prev-icon"></span>
            <a href="" class="carousel-control-next" href="#safariCarousel" data-slide="next"></a>
            <span class="carousel-control-next-icon"></span>
        </div>
    </body>
</html>
